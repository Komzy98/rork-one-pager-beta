# One-time production release: only adding/changing this specific file on main can trigger it.
# Normal future app pushes do NOT automatically build or submit to TestFlight.
name: One Pager iOS 128 · TestFlight (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-128-one-time-testflight.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate latest One Pager main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Regression tests
        run: npm test
      - name: TypeScript validation
        run: npx tsc --noEmit --pretty false
      - name: Confirm unique iOS build 128
        run: node -e "const a=require('./app.json').expo; if(a.ios.buildNumber!=='128')process.exit(1)"

  eas-ios-and-testflight:
    name: Queue EAS iOS 128 and automatic TestFlight submission
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: expo
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require Expo automation authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN GitHub Actions secret. Build was not submitted."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Queue production build 128 with TestFlight auto-submit
        run: npx eas-cli build --platform ios --profile production --auto-submit --non-interactive --no-wait
