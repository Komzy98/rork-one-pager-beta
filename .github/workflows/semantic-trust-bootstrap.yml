name: Semantic trust bootstrap

on:
  push:
    branches:
      - simplified-v1
    paths:
      - scripts/semantic_trust_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: simplified-v1
          fetch-depth: 0

      - name: Apply semantic trust fixes
        run: python scripts/semantic_trust_patch.py

      - name: Commit fixes
        run: |
          git config user.name "Josh Komolafe"
          git config user.email "josh.komolafe@gmail.com"
          git add expo/components/my-life/MyLifeWorldV3.tsx expo/components/activities/TodayPrimaryV2.tsx expo/utils/discoverLifeEngine.ts expo/utils/quietSynthesis.ts expo/utils/todayPhase.ts expo/utils/__tests__/semanticTrust.test.ts
          git commit -m "Improve semantic trust across primary tabs"
          git push origin HEAD:simplified-v1
