name: One Pager iOS 118 (one-off)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/onepager-ios-118.yml

permissions:
  contents: read

concurrency:
  group: onepager-ios-118
  cancel-in-progress: false

jobs:
  build-and-submit:
    if: contains(github.event.head_commit.message, '[build118]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: expo
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify iOS build number
        run: node -e 'const a=require("./app.json"); if(a.expo.ios.buildNumber!=="118") process.exit(1); console.log("One Pager iOS",a.expo.version,"("+a.expo.ios.buildNumber+")")'
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Events and Habit Engine regression tests
        run: node --import tsx --test utils/__tests__/habitEngineV2.test.ts utils/__tests__/feverDiscovery.test.ts utils/__tests__/fourEventProviders.test.ts utils/__tests__/licensedEventProviders.test.ts utils/__tests__/providerDiversity.test.ts
      - name: Verify Expo credentials
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Missing EXPO_TOKEN secret"; exit 1; }
          npx eas-cli whoami
          npx eas-cli project:info
      - name: Build iOS 118 and submit to TestFlight
        run: npx eas-cli build --profile production --platform ios --non-interactive --auto-submit --wait
