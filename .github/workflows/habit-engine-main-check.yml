name: Habit Engine Main Validation

on:
  push:
    branches:
      - habit-engine-main

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - run: npm ci
      - name: Habit Engine tests
        run: node --import tsx --test utils/__tests__/habitEngine.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Full existing test suite
        continue-on-error: true
        run: npm test
