name: One Pager iOS 124 TestFlight

# Intentionally manual-only; do not build automatically on every push.
jobs:
  build_ios:
    name: Build iOS 124
    type: build
    params:
      platform: ios
      profile: production

  submit_testflight:
    name: Submit build to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
